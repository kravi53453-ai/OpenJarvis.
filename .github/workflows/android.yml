name: OpenJarvis Android APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - "src/**"
      - "server/**"
      - "public/**"
      - "dist/**"
      - "dist-server/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "server/**"
      - "public/**"
      - "dist/**"
      - "dist-server/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Web/server checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ui

  android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../android-build.log

      - name: Prepare APK and source archive
        if: success()
        shell: bash
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk OpenJarvis-debug.apk
          sha256sum OpenJarvis-debug.apk > OpenJarvis-debug.apk.sha256
          zip -qr OpenJarvis-source.zip . \
            -x ".git/*" "node_modules/*" "android/.gradle/*" "android/**/build/*" \
               "OpenJarvis.apk" "*Backup.zip" "OpenJarvis-source.zip"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenJarvis-debug-APK
          path: |
            OpenJarvis-debug.apk
            OpenJarvis-debug.apk.sha256
          retention-days: 30

      - name: Upload complete source ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenJarvis-complete-source
          path: OpenJarvis-source.zip
          retention-days: 30

      - name: Keep Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenJarvis-android-build-log
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 14
