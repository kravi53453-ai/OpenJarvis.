# Builds OpenJarvis-debug.apk on GitHub's servers — no PC or Android SDK needed on your side.
# Runs automatically on every push to main that touches android/, and can be started by hand (Actions → Build Android APK → Run workflow).
# STATUS: written by the author but NEVER RUN (author had no GitHub access). If it fails, open the run, then the "build-log" artifact
# (or the failing step) and send the last ~40 lines back so the code can be fixed.
name: Build Android APK

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'server/**'
      - 'scripts/**'
      - 'tests/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'server/**'
      - 'scripts/**'
      - 'tests/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - '.github/workflows/android.yml'

permissions:
  contents: write   # needed to attach the APK to a Release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: TypeScript strict checks
        run: npm run typecheck

      - name: Build web UI and backend bundles
        run: npm run build

      - name: Backend, download manager and low-memory tests
        run: npm test

      - name: Install Playwright for browser regression tests
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Browser UI regression tests
        run: npm run test:ui

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Install Android SDK (platform 34, build-tools 34)
        uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build-log.txt

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk OpenJarvis-debug.apk
          test -s OpenJarvis-debug.apk
          unzip -t OpenJarvis-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging OpenJarvis-debug.apk | grep -q "package: name='com.openjarvis.app'"
          ls -lh OpenJarvis-debug.apk
          sha256sum OpenJarvis-debug.apk | tee OpenJarvis-debug.apk.sha256

      - name: Keep the build log (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: build-log, path: build-log.txt, if-no-files-found: ignore }

      - uses: actions/upload-artifact@v4
        with: { name: OpenJarvis-debug-apk, path: OpenJarvis-debug.apk }

      - name: Publish a Release (tap-to-download link for your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: OpenJarvis debug build ${{ github.run_number }}
          body: "Debug APK built by GitHub Actions. Install: download OpenJarvis-debug.apk, allow 'Install unknown apps' for your browser, open it. Compare the SHA-256 file if you like."
          files: |
            OpenJarvis-debug.apk
            OpenJarvis-debug.apk.sha256
          make_latest: true
