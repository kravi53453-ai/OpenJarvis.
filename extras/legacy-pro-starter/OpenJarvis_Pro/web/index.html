<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050914"><title>OpenJarvis</title><link rel="icon" href="assets/openjarvis.svg"><link rel="stylesheet" href="styles.css"></head><body>
<div class="app"><header><button id="menuBtn" class="icon" aria-label="Menu">☰</button><div class="brand">Open<span>Jarvis</span></div><button id="voiceMode" class="icon voice-shortcut" aria-label="Voice chat">◖))</button></header>
<aside id="drawer" class="drawer"><div class="drawer-head">OpenJarvis <button id="closeDrawer" class="icon">×</button></div><button id="newChat" class="nav">＋　New Chat</button><button id="historyBtn" class="nav">◷　History</button><button id="clearChat" class="nav">▤　Clear Chat</button><button id="settingsBtn" class="nav">⚙　Settings</button><button id="permissionsBtn" class="nav">▣　Permissions & setup</button><div class="drawer-note">Adam · Kajal<br><small>Personal AI assistant</small></div></aside>
<main><section id="welcome" class="welcome"><div class="welcome-symbol">◉</div><h1>How can I help?</h1><p>Your personal AI assistant</p></section><section id="messages" class="messages" aria-live="polite"></section></main>
<footer><div class="composer"><button id="attachBtn" class="icon" aria-label="Attach">＋</button><input id="prompt" placeholder="Ask anything..." autocomplete="off"><button id="micBtn" class="icon" aria-label="Voice input">🎙</button><button id="sendBtn" class="send" aria-label="Send">➤</button></div><input id="fileInput" type="file" hidden multiple></footer></div>
<section id="voiceScreen" class="voice-screen" aria-hidden="true"><div class="voice-head"><button id="voiceBack" class="icon">←</button><div><b>OpenJarvis Voice</b><small id="voiceStatus">Ready to listen</small></div><button id="characterBtn" class="switch-character">Adam⌄</button></div><div class="voice-center"><div id="orb" class="orb idle"><div class="orb-core"></div><i></i><i></i><i></i></div><div id="voiceCaption" class="voice-caption">Tap the microphone to talk</div><div id="voiceReply" class="voice-reply"></div></div><div class="voice-controls"><button id="muteBtn" class="round-control">🎙<small>Mute</small></button><button id="endVoice" class="end-control">■<small>End</small></button><button id="speakerBtn" class="round-control">◖))<small>Speaker</small></button></div></section>
<div id="modal" class="modal"><div class="modal-card"><div class="modal-title"><b id="modalTitle">Settings</b><button id="modalClose" class="icon">×</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script src="config.js"></script><script src="app.js"></script></body></html>
