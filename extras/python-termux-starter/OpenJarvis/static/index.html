<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenJarvis</title><style>*{box-sizing:border-box}body{margin:0;background:#07101f;color:#e8f1ff;font:16px system-ui}main{max-width:720px;margin:auto;padding:22px}h1{color:#9deaff;font-size:23px}.muted{color:#9aacc5}#chat{min-height:55vh;margin:25px 0}.m{white-space:pre-wrap;padding:13px;margin:10px 0;border:1px solid #23405c;border-radius:14px}.u{background:#102b46}.a{background:#0b1c31}.bar,.tools{display:flex;gap:8px;margin:10px 0}input{flex:1;min-width:0;background:#0d1c30;color:white;border:1px solid #294461;border-radius:13px;padding:14px}button{border:0;border-radius:12px;padding:12px;background:#087fbd;color:white}.tools button{background:#183451}</style></head><body><main><h1>OpenJarvis</h1><p class="muted">Your personal AI assistant</p><section id="chat"><h2>How can I help?</h2></section><div class="tools"><button onclick="get('/api/device')">Device diagnostics</button><button onclick="get('/api/health')">System health</button></div><div class="bar"><input id="q" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Send</button></div></main><script>const c=document.querySelector('#chat');function add(k,t){let d=document.createElement('div');d.className='m '+k;d.textContent=t;c.append(d)}async function send(){let q=document.querySelector('#q'),v=q.value.trim();if(!v)return;q.value='';add('u',v);try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v})});let j=await r.json();add('a',j.reply||j.error)}catch(e){add('a','Server connection failed')}}async function get(u){let j=await(await fetch(u)).json();add('a',JSON.stringify(j,null,2))}</script></body></html>
