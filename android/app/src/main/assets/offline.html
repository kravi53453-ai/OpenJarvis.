<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:16px system-ui;background:#0b0e14;color:#e8edf5;margin:0;padding:24px;line-height:1.5}code{background:#1c2431;padding:2px 6px;border-radius:6px}
button,input{font:inherit;padding:12px;border-radius:12px;border:1px solid #243044;background:#141a24;color:#e8edf5;width:100%;margin:6px 0}button{background:#4ea1ff;color:#06101f;font-weight:600}</style></head>
<body><h2>OpenJarvis server not reachable</h2>
<p>The app needs the OpenJarvis server running on this phone. Open <b>Termux</b> and run:</p>
<p><code>cd ~/OpenJarvis &amp;&amp; npm start</code></p>
<p>Then come back and press Retry.</p>
<button onclick="location.href=OJNative.getBackendUrl()">Retry</button>
<p>Server address:</p><input id="u"><button onclick="OJNative.setBackendUrl(document.getElementById('u').value)">Save address &amp; reload</button>
<script>document.getElementById('u').value=OJNative.getBackendUrl()</script></body></html>
